# v4 compute layer: CF Pages serves the static site; R2 serves media; homelab hosts internal services only — see docs/research/01-brand-brief.md §15
#
# Operator first-run note (inline, not CI): before the first deploy the operator must
# (1) create the Cloudflare Pages project `flowaxon-v4` and
# (2) add the repository secret CLOUDFLARE_API_TOKEN.
# The "guard-secrets" step below fails fast with a clear message if the secret is absent.

name: Deploy Pages (v4 compute layer)

on:
  push:
    branches: [main]
    paths:
      - "sites/v4/**"
      - "index.html"
      - "assets/v4/**"
      - "assets/video/**"
      - "ops/cf/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Guard required secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. The operator must add it under Settings > Secrets and variables > Actions before the first deploy."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Syntax sanity of built site files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          try:
              import yaml  # PyYAML ships preinstalled on GitHub runners
          except ImportError:  # pragma: no cover
              sys.exit(0)
          for yml in pathlib.Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(yml.read_text(encoding="utf-8"))
          print("workflow YAML parses OK")
          PY
          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            python3 -c "import sys; from html.parser import HTMLParser; p=sys.argv[1]; HTMLParser().feed(open(p, encoding='utf-8').read())" "$f"
          done
          echo "built HTML sanity-check OK"

      - name: Ensure Pages project exists (IaC self-heal)
        run: npx wrangler pages project create flowaxon-v4 --production-branch main || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name flowaxon-v4
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
