worker_processes auto;
worker_rlimit_nofile 1024;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    gzip on;

    server {
        listen 80;
        server_name mta-sts.flowaxon.com;

        location = /.well-known/mta-sts.txt {
            root /usr/share/nginx/html;
            default_type "text/plain; charset=utf-8";
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name www.flowaxon.com;
        return 301 https://flowaxon.com$request_uri;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name flowaxon.com _;
        root /usr/share/nginx/html;
        index index.html;

        location = /.well-known/mta-sts.txt {
            default_type "text/plain; charset=utf-8";
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN; # Build Theater self-frames the page (?embed=1); external framing still blocked
        add_header Referrer-Policy strict-origin-when-cross-origin;
        # C15 header-parity: same hardened set as _headers and main.go (self-only framing)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; media-src 'self' https://media.flowaxon.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
