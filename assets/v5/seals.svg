<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- SEAL-01: Cryptographic WriteReceipt Seals & Divider System -->
  <!-- State 1: ISSUED (active lease, claimed task, pending execution) -->
  <symbol id="seal-issued" viewBox="0 0 220 28">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <polygon points="6,1 214,1 219,6 219,22 214,27 6,27 1,22 1,6" opacity="0.6"/>
      <polygon points="8,3 212,3 217,8 217,20 212,25 8,25 3,20 3,8" opacity="0.35"/>
      <line x1="72" y1="3" x2="72" y2="25" opacity="0.4"/>
      <rect x="7" y="6" width="58" height="16" fill="currentColor" opacity="0.12"/>
      <text x="36" y="17.5" fill="currentColor" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">ISSUED</text>
      <text x="82" y="17.5" fill="currentColor" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="1">#6a605f76</text>
      <text x="168" y="17.5" fill="currentColor" opacity="0.65" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" letter-spacing="0.5">ACTIVE</text>
    </g>
  </symbol>

  <!-- State 2: SEALED (single-use cryptographic write-receipt proved & verified) -->
  <symbol id="seal-sealed" viewBox="0 0 236 28">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <polygon points="6,1 230,1 235,6 235,22 230,27 6,27 1,22 1,6" stroke="var(--amber, #8a5c06)"/>
      <polygon points="8,3 228,3 233,8 233,20 228,25 8,25 3,20 3,8" stroke="var(--amber, #8a5c06)" opacity="0.5"/>
      <line x1="76" y1="3" x2="76" y2="25" stroke="var(--amber, #8a5c06)" opacity="0.5"/>
      <rect x="7" y="5" width="62" height="18" fill="var(--amber, #8a5c06)" opacity="0.15"/>
      <text x="38" y="17.5" fill="var(--amber, #8a5c06)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">SEALED</text>
      <text x="86" y="17.5" fill="var(--amber, #8a5c06)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="1">#96fd2088</text>
      <text x="176" y="17.5" fill="var(--amber, #8a5c06)" opacity="0.85" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" letter-spacing="0.5">SINGLE-USE</text>
    </g>
  </symbol>

  <!-- State 3: REVOKED (halted execution, lease expired, boundary violation arrested) -->
  <symbol id="seal-revoked" viewBox="0 0 230 28">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <polygon points="6,1 224,1 229,6 229,22 224,27 6,27 1,22 1,6" stroke="var(--rust, #a34a2a)"/>
      <polygon points="8,3 222,3 227,8 227,20 222,25 8,25 3,20 3,8" stroke="var(--rust, #a34a2a)" opacity="0.5"/>
      <line x1="82" y1="3" x2="82" y2="25" stroke="var(--rust, #a34a2a)" opacity="0.5"/>
      <rect x="7" y="5" width="68" height="18" fill="var(--rust, #a34a2a)" opacity="0.15"/>
      <text x="41" y="17.5" fill="var(--rust, #a34a2a)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">REVOKED</text>
      <text x="92" y="17.5" fill="var(--rust, #a34a2a)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="1">#00000000</text>
      <text x="178" y="17.5" fill="var(--rust, #a34a2a)" opacity="0.85" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" letter-spacing="0.5">EXPIRED</text>
    </g>
  </symbol>

  <!-- Ledger Row Bullet & Mini Inspection Stamp -->
  <symbol id="seal-bullet" viewBox="0 0 14 14">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <polygon points="3.5,0.5 10.5,0.5 13.5,3.5 13.5,10.5 10.5,13.5 3.5,13.5 0.5,10.5 0.5,3.5" stroke="var(--amber, #8a5c06)"/>
      <rect x="4.5" y="4.5" width="5" height="5" fill="var(--amber, #8a5c06)"/>
    </g>
  </symbol>

  <!-- Section Divider Seal Symbol -->
  <symbol id="seal-divider-glyph" viewBox="0 0 280 28">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <line x1="0" y1="14" x2="16" y2="14" stroke="var(--bd2, #c9c1b1)"/>
      <polygon points="22,1 258,1 263,6 263,22 258,27 22,27 17,22 17,6" stroke="var(--amber, #8a5c06)"/>
      <polygon points="24,3 256,3 261,8 261,20 256,25 24,25 19,20 19,8" stroke="var(--amber, #8a5c06)" opacity="0.45"/>
      <rect x="23" y="5" width="64" height="18" fill="var(--amber, #8a5c06)" opacity="0.12"/>
      <text x="55" y="17.5" fill="var(--amber, #8a5c06)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">SEALED</text>
      <line x1="93" y1="3" x2="93" y2="25" stroke="var(--amber, #8a5c06)" opacity="0.4"/>
      <text x="103" y="17.5" fill="var(--amber, #8a5c06)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="1">#96fd2088</text>
      <text x="194" y="17.5" fill="var(--t5, #5e6878)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8.5" letter-spacing="0.5">GATE-PASSED</text>
      <line x1="264" y1="14" x2="280" y2="14" stroke="var(--bd2, #c9c1b1)"/>
    </g>
  </symbol>
</svg>
