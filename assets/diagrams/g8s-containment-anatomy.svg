<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="g8s-svg-title">
  <title id="g8s-svg-title">g8s Exponential Containment Rings (F0/F1/F2) and Orthogonal Control Strata (S0..S3)</title>
  <rect width="920" height="260" rx="8" fill="#060a10" stroke="#162438" stroke-width="2"/>
  <text x="24" y="28" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">G8S ZERO-TRUST ARCHITECTURE • AXIS X (CONTAINMENT RINGS F0/F1/F2) × AXIS Y (CONTROL STRATA S0..S3)</text>

  <!-- Stage 1: F0 Brain -->
  <rect x="24" y="48" width="195" height="150" rx="6" fill="#0b121e" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="36" y="60" width="171" height="22" rx="4" fill="#0c1926"/>
  <text x="121" y="75" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">RING F0 • BRAIN TIER</text>
  <text x="121" y="102" text-anchor="middle" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">S1 / S2 Governor</text>
  <text x="121" y="124" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Issues 1-Use WriteReceipt</text>
  <text x="121" y="142" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Authoritative Git Commit</text>
  <text x="121" y="160" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">• Operator ↔ F0 = 1:1</text>
  <text x="121" y="182" text-anchor="middle" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">0% Worker Loop Burn</text>

  <path d="M219 123 L252 123" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="252,118 262,123 252,128" fill="#38bdf8"/>

  <!-- Stage 2: SQLite WAL Queue & Stratum Firewall -->
  <rect x="262" y="48" width="195" height="150" rx="6" fill="#0b121e" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="274" y="60" width="171" height="22" rx="4" fill="#241705"/>
  <text x="359" y="75" text-anchor="middle" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">STRATUM FIREWALL</text>
  <text x="359" y="102" text-anchor="middle" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">SQLite WAL CAS Queue</text>
  <text x="359" y="124" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• 1 Issue = 1 Worker = 1 Rec</text>
  <text x="359" y="142" text-anchor="middle" fill="#fb7185" font-family="JetBrains Mono, monospace" font-size="10">• Blocks S1 / S3-A Writes</text>
  <text x="359" y="160" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Jev Reflex Gate (0/D/R/F/S)</text>
  <text x="359" y="182" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">n Workers ↔ Queue = n:1</text>

  <path d="M457 123 L490 123" stroke="#10b981" stroke-width="2"/>
  <polygon points="490,118 500,123 490,128" fill="#10b981"/>

  <!-- Stage 3: F1 Worker Sandbox -->
  <rect x="500" y="48" width="195" height="150" rx="6" fill="#0b121e" stroke="#10b981" stroke-width="1.5"/>
  <rect x="512" y="60" width="171" height="22" rx="4" fill="#091f15"/>
  <text x="597" y="75" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">RING F1 • WORKER TIER</text>
  <text x="597" y="102" text-anchor="middle" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">S3-M / S3-A (9router)</text>
  <text x="597" y="124" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Isolated Git Worktree</text>
  <text x="597" y="142" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• AllowedPaths Glob Guard</text>
  <text x="597" y="160" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Killable OS PGID (Setpgid)</text>
  <text x="597" y="182" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">F1 ↔ F1 = 0 (Zero Coupling)</text>

  <path d="M695 123 L728 123" stroke="#c084fc" stroke-width="2"/>
  <polygon points="728,118 738,123 728,128" fill="#c084fc"/>

  <!-- Stage 4: F2 Subagent & Sealed Evidence -->
  <rect x="738" y="48" width="158" height="150" rx="6" fill="#0b121e" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="750" y="60" width="134" height="22" rx="4" fill="#1a0f26"/>
  <text x="817" y="75" text-anchor="middle" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">RING F2 &amp; VERIFY</text>
  <text x="817" y="102" text-anchor="middle" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">F2 ⊆ F1 ⊆ F0</text>
  <text x="817" y="124" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Shares F1 Receipt</text>
  <text x="817" y="142" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">• Draft-7 JSON Schema</text>
  <text x="817" y="160" text-anchor="middle" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">• g8s verify --json</text>
  <text x="817" y="182" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">g8s deliver → main</text>

  <!-- Bottom Invariant Bar -->
  <rect x="24" y="214" width="872" height="30" rx="4" fill="#000000" stroke="#162438"/>
  <text x="460" y="233" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">INVARIANT LAW: F0 never runs raw log-hunting loops • F1 never mutates outside WriteReceipt.AllowedPaths • S3-A verifies blind</text>
</svg>
