<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <rect width="900" height="320" fill="#070709"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#e4e4e7">
    <rect x="40" y="80" width="180" height="160" rx="8" fill="#18181b" stroke="#a1a1aa" stroke-width="2"/>
    <text x="130" y="115" text-anchor="middle" font-weight="600" fill="#a1a1aa">Untrusted Agent</text>
    <text x="130" y="135" text-anchor="middle" font-size="11" fill="#71717a">Shell Intent</text>
    <text x="130" y="175" text-anchor="middle" font-size="11" fill="#71717a">CLI command</text>
    <text x="130" y="195" text-anchor="middle" font-size="11" fill="#71717a">stream</text>
    <polygon points="220,155 240,145 240,165" fill="#a1a1aa"/>

    <rect x="250" y="80" width="190" height="160" rx="8" fill="#241705" stroke="#f59e0b" stroke-width="2"/>
    <text x="345" y="115" text-anchor="middle" font-weight="600" fill="#f59e0b">Layer 1</text>
    <text x="345" y="135" text-anchor="middle" font-size="11" fill="#f59e0b">Shell AST</text>
    <text x="345" y="155" text-anchor="middle" font-size="11" fill="#f59e0b">Risk Scorer</text>
    <text x="345" y="195" text-anchor="middle" font-size="11" fill="#71717a">Tokenizes verbs/flags</text>
    <text x="345" y="215" text-anchor="middle" font-size="11" fill="#71717a">Scores 0..100</text>
    <polygon points="440,155 460,145 460,165" fill="#f59e0b"/>

    <rect x="470" y="80" width="190" height="160" rx="8" fill="#240c14" stroke="#fb7185" stroke-width="2"/>
    <text x="565" y="115" text-anchor="middle" font-weight="600" fill="#fb7185">Layer 2</text>
    <text x="565" y="135" text-anchor="middle" font-size="11" fill="#fb7185">Telegram HITL</text>
    <text x="565" y="155" text-anchor="middle" font-size="11" fill="#fb7185">2FA Gate</text>
    <text x="565" y="195" text-anchor="middle" font-size="11" fill="#71717a">HMAC-SHA256 signed</text>
    <text x="565" y="215" text-anchor="middle" font-size="11" fill="#71717a">Approve / Deny</text>
    <text x="565" y="235" text-anchor="middle" font-size="11" fill="#71717a">Kill PGID</text>
