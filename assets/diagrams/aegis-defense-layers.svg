    <text x="785" y="135" text-anchor="middle" font-size="11" fill="#10b981">Pre-Commit DLP</text>
    <text x="785" y="155" text-anchor="middle" font-size="11" fill="#10b981">Safe Execution</text>
    <text x="785" y="195" text-anchor="middle" font-size="11" fill="#71717a">Blocks RFC1918</text>
    <text x="785" y="215" text-anchor="middle" font-size="11" fill="#71717a">Blocks secrets</text>
    <text x="785" y="235" text-anchor="middle" font-size="11" fill="#71717a">Logs→VictoriaLogs</text>
